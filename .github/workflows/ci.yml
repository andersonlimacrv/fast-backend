# CI mirrors the Fase 1 manual gates: lint → unit → integration → security.
# It invokes the SAME make targets developers run (docs/Makefile.md) — never
# duplicated commands. Drift either way is a bug.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev --frozen
      - run: make lint
      - run: make types
      - run: make arch

  unit:
    runs-on: ubuntu-latest
    env:
      FRONTEND_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev --frozen
      - run: make test-unit

  integration:
    runs-on: ubuntu-latest
    env:
      FRONTEND_URL: http://localhost:3001
      MINIO_ENDPOINT_URL: http://localhost:9000
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev --frozen
      - name: Install pg client 17 (matches POSTGRES_IMAGE major)
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
          pg_dump --version
      - name: Start MinIO binary (pinned, no registry)
        # Both registries deny minio pulls from these runners (quay.io 500,
        # Hub access-denied) — run the pinned GitHub Release binary instead
        # (same tag as MINIO_IMAGE, sha256-verified). The fixture uses
        # MINIO_ENDPOINT_URL and skips the container entirely.
        run: |
          TAG=RELEASE.2025-04-22T22-12-26Z
          curl -sSL "https://github.com/minio/minio/releases/download/${TAG}/minio.linux-amd64.${TAG}" -o /tmp/minio
          curl -sSL "https://github.com/minio/minio/releases/download/${TAG}/minio.linux-amd64.${TAG}.sha256sum" -o /tmp/minio.sha256sum
          cd /tmp && sha256sum -c minio.linux-amd64.${TAG}.sha256sum
          chmod +x /tmp/minio
          mkdir -p /tmp/minio-data
          MINIO_ROOT_USER=minioadmin MINIO_ROOT_PASSWORD=minioadmin123 /tmp/minio server /tmp/minio-data --address :9000 >/tmp/minio.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:9000/minio/health/live && break || sleep 2; done
      - run: make test-integration

  security:
    runs-on: ubuntu-latest
    env:
      FRONTEND_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev --frozen
      - name: Install gitleaks (pinned, matches local gate)
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tgz
          sudo tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks
          gitleaks version
      - run: make security

  web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fastbackend
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: valkey/valkey:9-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/fastbackend
      REDIS_URL: redis://localhost:6379/0
      # Browser origin must be allowed or every SPA fetch fails closed (status 0).
      CORS_ORIGINS: '["http://localhost:3001"]'
      FRONTEND_URL: http://localhost:3001
      # Cookie sessions on (dual-read keeps header tests green); Secure off:
      # plain-http preview would silently drop Secure cookies (see DEPLOYMENT).
      AUTH_COOKIE_ENABLED: 'true'
      AUTH_COOKIE_SECURE: 'false'
      # Bake the API origin into the SPA build (no client/.env in CI).
      VITE_API_URL: http://127.0.0.1:8001
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev --frozen
      - run: uv run alembic upgrade head
      - run: nohup uv run uvicorn app.main:create_app --factory --host 127.0.0.1 --port 8001 >/tmp/api.log 2>&1 &
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: cd client && npm ci
      - run: make web-lint web-test web-build
      - run: make web-e2e-install
      - run: make web-e2e
