# Deploy: build immutable image → push → migrate → healthcheck-gate → rollback.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: "Git SHA to deploy (default: current commit)"
        required: false

env:
  REGISTRY: ghcr.io
  IMAGE_REPO: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "sha=${{ inputs.sha || github.sha }}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          push: true
          tags: ${{ env.IMAGE_REPO }}:${{ steps.meta.outputs.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev --frozen
      - name: Unit-test deploy logic
        run: uv run pytest app/tests/unit/test_deploy.py -q
      - name: Check VPS configured
        id: gate
        run: |
          if [ -z "${{ secrets.VPS_HOST }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "No VPS secrets — deploy skipped gracefully."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy over SSH
        if: steps.gate.outputs.configured == 'true'
        env:
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_USER: ${{ secrets.VPS_USER }}
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SHA: ${{ needs.build.outputs.sha }}
        run: |
          mkdir -p ~/.ssh && echo "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=accept-new "$SSH_USER@$SSH_HOST" \
            "IMAGE=$IMAGE_REPO:$SHA PREV=\$(cat ~/fast-backend/.deploy-sha 2>/dev/null || true) bash -s" <<'EOF'
          set -euo pipefail
          cd ~/fast-backend
          echo "$SHA" > .deploy-next
          IMAGE="$IMAGE" docker compose -f docker-compose.prod.yml up -d --quiet-pull
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/readyz || true)
            [ "$code" = "200" ] && break
            sleep 10
          done
          if [ "${code:-000}" = "200" ]; then
            echo "$SHA" > .deploy-sha
            echo "deployed $SHA"
          else
            echo "healthcheck failed, rolling back to $PREV"
            IMAGE="$PREV" docker compose -f docker-compose.prod.yml up -d --quiet-pull
            exit 1
          fi
          EOF
