# Seeds linux snapshot baselines for the browser E2E (one-off per visual change).
# Why: baselines are OS-specific (fonts); win32/ regenerates locally and is
# gitignored, linux/ is committed by THIS workflow only. Never run
# --update-snapshots locally and commit the result.
# Usage: gh workflow run web-e2e-baselines.yml -f branch=reform/pr6-audit
name: web-e2e-baselines

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to seed baselines on
        required: true
        default: main

jobs:
  seed:
    runs-on: ubuntu-latest
    # Needed for the final push of seeded baselines back to the branch.
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fastbackend
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: valkey/valkey:9-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/fastbackend
      REDIS_URL: redis://localhost:6379/0
      # Browser origin must be allowed or every SPA fetch fails closed (status 0).
      CORS_ORIGINS: '["http://localhost:5173"]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev --frozen
      - run: uv run alembic upgrade head
      - run: nohup uv run uvicorn app.main:create_app --factory --host 127.0.0.1 --port 8000 >/tmp/api.log 2>&1 &
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: cd client && npm ci
      - run: cd client && npm run build
      - run: cd client && npx playwright install chromium --with-deps
      - run: cd client && npx playwright test --project=chromium --update-snapshots
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add client/e2e/__snapshots__/linux/
          git diff --cached --quiet && echo "no new baselines" && exit 0
          git commit -m "test(client): seed linux e2e baselines"
          git push origin HEAD:${{ inputs.branch }}
