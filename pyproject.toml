[[tool.importlinter.contracts]]
name = "no-provider-imports-in-modules"
type = "forbidden"
source_modules = ["app.modules"]
forbidden_modules = ["aioboto3", "botocore", "aiosmtplib", "jinja2", "taskiq", "taskiq_redis"]
broken_contract_guidance = "See docs/RULES.md §4: modules use core/contracts; only infrastructure adapts providers."

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "asyncpg.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["aioboto3.*", "botocore.*", "docker.*"]
ignore_missing_imports = true
