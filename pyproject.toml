[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fast-backend-app"
version = "0.3.1"
description = "fast-backend — Modular Monolith Async FastAPI SaaS Kernel (auth-foundation)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.16",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "email-validator>=2.0",
    "pwdlib[argon2]>=0.2",
    "bcrypt>=4.0",
    "PyJWT>=2.8",
    "redis>=6.1",
    "httpx>=0.28",
    "aiosmtplib>=3.0",
    "jinja2>=3.1",
    "aioboto3>=13",
    "taskiq>=0.11",
    "taskiq-redis>=1.1",
    "stripe>=9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "testcontainers[postgres,redis]>=4.10",
    "faker>=37",
    "ruff>=0.9",
    "mypy>=1.14",
    "bandit>=1.8",
    "pip-audit>=2.7",
    "import-linter>=1.13",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["app/tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
addopts = ["-v", "--strict-markers", "--tb=short", "--disable-warnings"]
markers = [
    "unit: Unit tests without external services",
    "integration: Integration tests with real Postgres/Redis via testcontainers",
    "e2e: End-to-end tests",
    "slow: Slow running tests",
    "security: Security-focused tests",
]

[tool.ruff]
line-length = 128

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"app/modules/admin/router.py" = ["B008"]
"app/modules/admin/dependencies.py" = ["B008"]
"app/modules/identity/router.py" = ["B008"]
"app/modules/identity/dependencies.py" = ["B008"]
"app/modules/organization/router.py" = ["B008"]
"app/modules/projects/router.py" = ["B008"]
"app/modules/tenancy/dependencies.py" = ["B008"]
"app/modules/tenancy/public.py" = ["B008"]
"app/modules/entitlements/dependencies.py" = ["B008"]
"app/modules/entitlements/router.py" = ["B008"]
"app/modules/audit/router.py" = ["B008"]
"scripts/backup.py" = ["S603"]
"scripts/auto_release.py" = ["S603"]
"app/tests/**/*.py" = ["S105", "S106", "S107", "S603", "S607"]

[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "layers"
type = "layers"
layers = ["app.interfaces", "app.modules", "app.core"]
broken_contract_guidance = "See docs/RULES.md §4: imports flow interfaces → modules → core/contracts."

[[tool.importlinter.contracts]]
name = "core-independence"
type = "forbidden"
source_modules = ["app.core"]
forbidden_modules = ["app.modules", "app.interfaces", "app.infrastructure"]
broken_contract_guidance = "See docs/RULES.md §4: core imports nothing of ours."

[[tool.importlinter.contracts]]
name = "infrastructure-no-upward-imports"
type = "forbidden"
source_modules = ["app.infrastructure"]
forbidden_modules = ["app.modules", "app.interfaces"]
broken_contract_guidance = "See docs/RULES.md §4: adapters never import modules/interfaces."

[[tool.importlinter.contracts]]
name = "audit-internals-private"
type = "forbidden"
source_modules = ["app.modules.billing_stripe", "app.modules.entitlements", "app.modules.identity", "app.modules.organization", "app.modules.projects", "app.modules.tenancy", "app.modules.admin"]
allow_indirect_imports = true
forbidden_modules = [
    "app.modules.audit.models",
    "app.modules.audit.repository",
    "app.modules.audit.service",
    "app.modules.audit.dependencies",
    "app.modules.audit.router",
    "app.modules.audit.schemas",
]
broken_contract_guidance = "See docs/RULES.md §4: depend only on modules/<name>/public.py, core/contracts, or Taskiq events. When adding a module, add its contract and list it in the others."

