# Local dev: app + worker + postgres + redis. Tools (mailpit/minio) via profiles.
services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fastbackend
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: ${REDIS_IMAGE:-valkey/valkey:9-alpine}
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Isolated browser-E2E data services (profiles: never start with plain up).
  # Own ports + volumes: e2e runs must not touch dev pgdata.
  db-e2e:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    profiles: [e2e]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fastbackend
    ports:
      - "${E2E_PG_PORT:-5434}:5432"
    volumes:
      - pgdata_e2e:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-e2e:
    image: ${REDIS_IMAGE:-valkey/valkey:9-alpine}
    profiles: [e2e]
    ports:
      - "${E2E_REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      target: dev
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/fastbackend
      REDIS_URL: redis://redis:6379/0
      TASK_BROKER_URL: redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/code/app

  worker:
    build:
      context: .
      target: dev
    command: ["uv", "run", "taskiq", "worker", "app.worker:broker", "--workers", "2"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/fastbackend
      REDIS_URL: redis://redis:6379/0
      TASK_BROKER_URL: redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/code/app

  mailpit:
    image: axllent/mailpit:v1.21
    profiles: [tools]
    ports:
      - "1025:1025"
      - "8025:8025"

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: [tools]
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  pgdata_e2e:
  miniodata:
