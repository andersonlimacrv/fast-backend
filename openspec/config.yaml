schema: spec-driven

context: |
  fast-backend — Modular Monolith Async FastAPI SaaS Kernel.
  Stack: FastAPI async, SQLAlchemy 2.0, Pydantic v2, Postgres, Redis, Alembic, Taskiq, Docker, uv.
  Frozen: CORE_MODULES as a concept (never PLATFORM_MODULES) — no runtime registry, composition by flags in app/main.py; auth própria sem crudauth (Argon2id/pwdlib, JWT HS256 10-15min, refresh opaco Postgres + rotation/reuse/atomic FOR UPDATE, tokens_valid_after); TENANCY_MODE=single|row, no RLS in v1; active_org_id is context, membership Postgres is authority; logical idempotency only. (Former references/implementation_v2.md was audited into openspec/changes/v2-coverage-audit/design.md and removed 2026-10-13.)
  Hierarchy: AGENTS.md > docs/RULES.md > docs/ROADMAP.md > docs/adr/* > copy/*. PT-BR docs, English code. Conventional Commits, no secrets, no app/ without approved change.

rules:
  proposal:
    - Cite the v2-coverage-audit table section + docs/adr when touching auth/tenancy/modules.
    - Always include Non-goals (RULES §90) and acceptance criteria with real-Postgres tests.
  tasks:
    - Order: auth → tenancy → RBAC → email/storage/jobs → audit/obs/backup → billing last.
